<div class="linkedin-badge sidebar__right sticky">
    <style>
        .linkedin-badge {
            background: #fff;
            border: 1px solid #e1e9ee;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Fira Sans", Ubuntu, Oxygen, "Oxygen Sans", Cantarell, "Droid Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Lucida Grande", Helvetica, Arial, sans-serif;
        }

        .linkedin-badge__header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .linkedin-badge__avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
        }

        .linkedin-badge__name {
            font-weight: 600;
            font-size: 16px;
            color: #0a66c2;
            text-decoration: none;
        }

        .linkedin-badge__headline {
            font-size: 12px;
            color: #5f6368;
            margin-top: 4px;
            line-height: 1.4;
        }

        .linkedin-badge__button {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #0a66c2;
            color: white !important;
            padding: 6px 0;
            border-radius: 16px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .linkedin-badge__button:hover {
            background-color: #004182;
        }
    </style>

    {% assign profile = site.data.linkedin %}
    <div class="linkedin-badge__header">
        <img src="{{ profile.avatar | relative_url }}" alt="{{ profile.name }}" class="linkedin-badge__avatar">
        <div>
            <a href="{{ profile.profile_url }}" class="linkedin-badge__name" target="_blank" rel="noopener noreferrer">
                {{ profile.name }}
            </a>
            <div class="linkedin-badge__headline">{{ profile.headline }}</div>
        </div>
    </div>

    <a href="{{ profile.profile_url }}" class="linkedin-badge__button" target="_blank" rel="noopener noreferrer">
        View Profile
    </a>
</div>

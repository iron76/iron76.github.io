<div class="linkedin-badge sidebar__right sticky"
    style="background: #fff; border: 1px solid #e1e9ee; border-radius: 8px; padding: 16px; margin-top: 20px; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Fira Sans', Ubuntu, Oxygen, 'Oxygen Sans', Cantarell, 'Droid Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Lucida Grande', Helvetica, Arial, sans-serif;">
    {% assign profile = site.data.linkedin %}
    <div class="linkedin-badge__header" style="display: flex; align-items: center; margin-bottom: 12px;">
        <img src="{{ profile.avatar | relative_url }}" alt="{{ profile.name }}" class="linkedin-badge__avatar"
            style="width: 48px; height: 48px; border-radius: 50%; margin-right: 12px; object-fit: cover;">
        <div>
            <a href="{{ profile.profile_url }}" class="linkedin-badge__name" target="_blank" rel="noopener noreferrer"
                style="font-weight: 600; font-size: 16px; color: #0a66c2; text-decoration: none;">
                {{ profile.name }}
            </a>
            <div class="linkedin-badge__headline"
                style="font-size: 12px; color: #5f6368; margin-top: 4px; line-height: 1.4;">{{ profile.headline }}</div>
        </div>
    </div>

    <a href="{{ profile.profile_url }}" class="linkedin-badge__button" target="_blank" rel="noopener noreferrer"
        style="display: block; width: 100%; text-align: center; background-color: #0a66c2; color: white !important; padding: 6px 0; border-radius: 16px; font-weight: 600; font-size: 14px; text-decoration: none;">
        View Profile
    </a>
</div>

<div class="linkedin-badge"
    style="background: #fff; border: 1px solid #e1e9ee; border-radius: 8px; padding: 16px; margin-top: 0px; font-family: -apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Fira Sans', Ubuntu, Oxygen, 'Oxygen Sans', Cantarell, 'Droid Sans', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Lucida Grande', Helvetica, Arial, sans-serif;">
    {% assign profile = site.data.linkedin %}
    <div class="linkedin-badge__header" style="display: flex; align-items: center; margin-bottom: 12px;">
        <img src="{{ profile.avatar | relative_url }}" alt="{{ profile.name }}" class="linkedin-badge__avatar"
            style="width: 48px; height: 48px; border-radius: 50%; margin-right: 12px; object-fit: cover;">
        <div>
            <a href="{{ profile.profile_url }}" class="linkedin-badge__name" target="_blank" rel="noopener noreferrer"
                style="font-weight: 600; font-size: 16px; color: #0a66c2; text-decoration: none;">
                {{ profile.name }}
            </a>
            <div class="linkedin-badge__headline"
                style="font-size: 12px; color: #5f6368; margin-top: 4px; line-height: 1.4;">{{ profile.headline }}</div>
        </div>
    </div>

    <a href="{{ profile.profile_url }}" class="linkedin-badge__button" target="_blank" rel="noopener noreferrer"
        style="display: block; width: 100%; text-align: center; background-color: #0a66c2; color: white !important; padding: 6px 0; border-radius: 16px; font-weight: 600; font-size: 14px; text-decoration: none;">
        View Profile
    </a>

    {% if profile.posts %}
    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e1e9ee;">
        <h3 style="font-size: 14px; color: #000; margin: 0 0 12px 0; font-weight: 600;">Recent Updates</h3>
        {% for post in profile.posts %}
        <div style="margin-bottom: 12px; line-height: 1.4;">
            <a href="{{ post.url }}" target="_blank" rel="noopener noreferrer"
                style="font-size: 13px; color: #0a66c2; font-weight: 600; text-decoration: none; display: block; margin-bottom: 2px;">
                {{ post.title }}
            </a>
            <span style="font-size: 11px; color: #5f6368;">{{ post.date }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
